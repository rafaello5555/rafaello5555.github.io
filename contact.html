<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Me</title>
</head>
<body>
  <h1>Contact Me</h1>
  <form action="https://formspree.io/f/myznbeee" method="POST">
    <label>Name</label>
    <input type="text" name="name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Message</label>
    <textarea name="message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</body>
</html>
