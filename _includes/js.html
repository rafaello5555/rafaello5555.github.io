<!-- Auto-open portfolio modals if URL has hash -->
<script>
  $(document).ready(function() {
      if (window.location.hash) {
          var hash = window.location.hash;
          if ($(hash).hasClass('portfolio-modal')) {
              $(hash).modal('show');
          }
      }
  });
</script>
