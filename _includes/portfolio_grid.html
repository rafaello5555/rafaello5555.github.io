

<!-- Hero/Profile Section -->
<section id="hero">
  <div class="container hero-flex">
    <img src="{{ '/img/my_pic.png' | relative_url }}" alt="Rafael Mahammadli" class="hero-img">
    <div class="hero-text">
      <h1>Rafaello Mahammadli</h1>
      <p>AI/ML Engineer - Computer Vision Engineer - Data Analyst - Data Scientist</p>
    </div>
  </div>
</section>






<!-- Portfolio Grid Section -->
<section id="portfolio">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Portfolio</h2>
        <hr class="star-primary">
      </div>
    </div>
    <div class="portfolio-flex-row">
      {% for post in site.posts %}
      <div class="portfolio-flex-item portfolio-item">
        <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
          <div class="caption">
            <div class="caption-content">
              <i class="fa fa-search-plus fa-3x"></i>
            </div>
          </div>
          <img src="img/portfolio/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
