---
layout: publications
title: Publications
permalink: /publications/
---

<h2 class="text-center mb-5">Publications</h2>

<div class="row">
  {% for pub in site.data.publications %}
  <div class="col-md-6 col-lg-4 mb-4">
    <div class="card shadow-sm border-0 rounded-3 h-100 fade-in">
      <div class="card-body">
        <h5 class="card-title">{{ pub.title }}</h5>
        <p class="card-text text-muted">
          Published at <strong>{{ pub.university }}</strong> — {{ pub.year }}<br>
          {{ pub.description }}
        </p>
        <a href="{{ pub.link }}" class="btn btn-primary btn-sm" target="_blank">
          View Publication
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
